<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .hex  { fill: #2a2147; font-size: 16px; }
    .name { fill: #c9a0ff; font-size: 56px; font-weight: 700; letter-spacing: 3px; filter: url(#glow); }
    .sub  { fill: #00e5ff; font-size: 21px; letter-spacing: 4px; }
    .cmd  { fill: #e0c8ff; font-size: 20px; }
    .cur  { animation: blink 1s steps(1) infinite; }
    .node { animation: pulse 3s ease-in-out infinite; }
    .n2   { animation-delay: 1s; }
    .n3   { animation-delay: 2s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="360" fill="#0d0b1a"/>
  <rect x="24" y="24" width="952" height="312" fill="none" stroke="#7c3aed" stroke-width="2"/>

  <!-- tiny neural network, left -->
  <g stroke="#3b2d6b" stroke-width="1.5">
    <line x1="70" y1="80"  x2="120" y2="60"/><line x1="70" y1="80"  x2="120" y2="110"/>
    <line x1="70" y1="130" x2="120" y2="60"/><line x1="70" y1="130" x2="120" y2="110"/>
    <line x1="120" y1="60" x2="170" y2="85"/><line x1="120" y1="110" x2="170" y2="85"/>
  </g>
  <g fill="#c9a0ff">
    <circle class="node" cx="70" cy="80" r="6"/><circle class="node n2" cx="70" cy="130" r="6"/>
    <circle class="node n2" cx="120" cy="60" r="6"/><circle class="node n3" cx="120" cy="110" r="6"/>
    <circle class="node" cx="170" cy="85" r="6" fill="#00e5ff"/>
  </g>

  <!-- tiny neural network, right -->
  <g stroke="#3b2d6b" stroke-width="1.5">
    <line x1="830" y1="85" x2="880" y2="60"/><line x1="830" y1="85" x2="880" y2="110"/>
    <line x1="880" y1="60" x2="930" y2="80"/><line x1="880" y1="60" x2="930" y2="130"/>
    <line x1="880" y1="110" x2="930" y2="80"/><line x1="880" y1="110" x2="930" y2="130"/>
  </g>
  <g fill="#c9a0ff">
    <circle class="node n3" cx="830" cy="85" r="6" fill="#00e5ff"/>
    <circle class="node" cx="880" cy="60" r="6"/><circle class="node n2" cx="880" cy="110" r="6"/>
    <circle class="node n2" cx="930" cy="80" r="6"/><circle class="node n3" cx="930" cy="130" r="6"/>
  </g>

  <text class="hex" x="50"  y="255">0110</text>
  <text class="hex" x="50"  y="290">A3F1</text>
  <text class="hex" x="50"  y="325">7C2E</text>
  <text class="hex" x="950" y="255" text-anchor="end">9B04</text>
  <text class="hex" x="950" y="290" text-anchor="end">E17D</text>
  <text class="hex" x="950" y="325" text-anchor="end">5D88</text>

  <text class="name" x="500" y="175" text-anchor="middle">ADITI CHOUDHARY</text>
  <rect class="cur" x="788" y="122" width="12" height="54" fill="#00e5ff"/>
  <text class="sub" x="500" y="232" text-anchor="middle">B.TECH CSE • AI &amp; ML • SRM IST NCR</text>
  <text class="cmd" x="500" y="285" text-anchor="middle">~/aditi python train.py --epochs 100</text>
</svg>
